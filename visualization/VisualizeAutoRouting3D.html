<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Auto Routing V2 - 3D Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #0a0a1e; color: #eee; overflow: hidden; }
#canvas3d { width: 100vw; height: 100vh; display: block; }

#panel {
  position: fixed; top: 0; left: 0; width: 340px; height: 100vh;
  background: rgba(12,12,28,0.94); border-right: 1px solid #334;
  display: flex; flex-direction: column; z-index: 10;
}
#panel-header { padding: 14px 16px; border-bottom: 1px solid #334; }
#panel-header h2 { font-size: 14px; color: #0fc; margin-bottom: 6px; }
#panel-header .subtitle { font-size: 11px; color: #667; }
#route-list { flex: 1; overflow-y: auto; padding: 6px 0; }

.route-item {
  padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #1a1a30;
  transition: background 0.15s; font-size: 12px;
}
.route-item:hover { background: rgba(0,255,200,0.08); }
.route-item.active { background: rgba(0,255,200,0.18); border-left: 3px solid #0fc; }
.route-item .title { font-weight: 600; color: #0fc; }
.route-item .meta { color: #889; font-size: 11px; margin-top: 3px; line-height: 1.5; }
.route-item .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-right: 4px; }
.badge-pass { background: #0a4a2a; color: #0f8; }
.badge-warn { background: #4a3a0a; color: #fa0; }

#detail {
  position: fixed; bottom: 0; left: 340px; right: 0;
  background: rgba(12,12,28,0.94); border-top: 1px solid #334;
  padding: 14px 20px; z-index: 10; display: none; max-height: 220px; overflow-y: auto;
}
#detail h3 { font-size: 13px; color: #0fc; margin-bottom: 8px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 16px; font-size: 12px; }
.detail-grid .field { color: #778; }
.detail-grid .field span { color: #cde; }
.sim-bar { display: inline-block; height: 6px; border-radius: 3px; background: #0a4; margin-left: 4px; vertical-align: middle; }

#toolbar {
  position: fixed; top: 10px; left: 360px; z-index: 10; display: flex; gap: 6px;
}
#toolbar button {
  background: #1a1a3a; border: 1px solid #445; color: #aaf; padding: 5px 12px;
  cursor: pointer; border-radius: 4px; font-size: 12px;
}
#toolbar button:hover { background: #2a2a5a; }
#toolbar button.active { background: #0a3a3a; border-color: #0fc; color: #0fc; }

#legend {
  position: fixed; top: 10px; right: 16px; background: rgba(12,12,28,0.90);
  border: 1px solid #334; border-radius: 6px; padding: 12px 16px; z-index: 10; font-size: 11px;
}
.legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.legend-box { width: 16px; height: 8px; border-radius: 2px; }
#stats { position: fixed; bottom: 10px; right: 16px; font-size: 10px; color: #445; z-index: 10; }
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>

<div id="panel">
  <div id="panel-header">
    <h2>Auto Routing V2 Viewer</h2>
    <div class="subtitle">장비 형상 + 기둥 + 자동 생성 경로</div>
  </div>
  <div id="route-list"></div>
</div>

<div id="toolbar">
  <button id="btn-equip" class="active">장비</button>
  <button id="btn-columns" class="active">기둥</button>
  <button id="btn-groups">기존 그룹</button>
  <button id="btn-auto" class="active">자동 경로</button>
  <button id="btn-fit">Fit</button>
</div>

<div id="legend">
  <div class="legend-row"><div class="legend-box" style="background:rgba(100,140,255,0.4)"></div>장비 BBox</div>
  <div class="legend-row"><div class="legend-box" style="background:rgba(255,60,60,0.4)"></div>기둥 (COLUMN)</div>
  <div class="legend-row"><div class="legend-box" style="background:rgba(0,255,200,0.8)"></div>자동 생성 경로</div>
  <div class="legend-row"><div class="legend-box" style="background:rgba(180,180,255,0.3)"></div>기존 그룹 경로</div>
  <div class="legend-row"><div class="legend-box" style="background:rgba(255,255,0,0.6)"></div>시작 PoC</div>
  <div class="legend-row"><div class="legend-box" style="background:rgba(255,80,100,0.6)"></div>종단점</div>
</div>

<div id="detail"><h3 id="detail-title"></h3><div class="detail-grid" id="detail-grid"></div></div>
<div id="stats"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── 데이터 로드 ──
const DESIGN_JSON = '../data/input/CMP_KSCTA01_260323_082626_total.json';
const GROUP_JSON = '../data/GroupPipeResults/group_pipe_results_20260405194814.json';
const AUTO_JSON = '../data/AutoRoutingResults/test_v2_multi.json';

const [designData, groupData, autoData] = await Promise.all([
  fetch(DESIGN_JSON).then(r => r.json()),
  fetch(GROUP_JSON).then(r => r.json()).catch(() => []),
  fetch(AUTO_JSON).then(r => r.json()).catch(() => []),
]);

// ── Y-up 좌표 변환 ──
const toY = (x, y, z) => new THREE.Vector3(x, z, -y);

function reconstructPath(path) {
  const pts = [];
  const sp = path.start_pos;
  let x = sp[0], y = sp[1], z = sp[2];
  pts.push(toY(x, y, z));
  for (const v of (path.path_step_vectors || [])) {
    x += v.x; y += v.y; z += v.z;
    pts.push(toY(x, y, z));
  }
  return pts;
}

// ── Three.js 초기화 ──
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x060612);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 500000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0x445566, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(10000, 30000, 15000);
scene.add(dirLight);
scene.add(new THREE.GridHelper(60000, 60, 0x1a2233, 0x0a1122));

const allPts = [];

// ── 장비 BBox ──
const equipGroup = new THREE.Group();
const eq = Array.isArray(designData.Equipment) ? designData.Equipment[0] : designData.Equipment;
if (eq?.boundaryBox) {
  const bb = eq.boundaryBox;
  const sx = bb.max.x - bb.min.x, sy = bb.max.y - bb.min.y, sz = bb.max.z - bb.min.z;
  const cx = (bb.min.x + bb.max.x)/2, cy = (bb.min.y + bb.max.y)/2, cz = (bb.min.z + bb.max.z)/2;
  const boxG = new THREE.BoxGeometry(sx, sz, sy);
  const boxM = new THREE.MeshPhongMaterial({ color: 0x6488ff, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false });
  const mesh = new THREE.Mesh(boxG, boxM);
  mesh.position.copy(toY(cx, cy, cz));
  equipGroup.add(mesh);
  const wire = new THREE.LineSegments(new THREE.EdgesGeometry(boxG), new THREE.LineBasicMaterial({ color: 0x6488ff, transparent: true, opacity: 0.5 }));
  wire.position.copy(mesh.position);
  equipGroup.add(wire);
  allPts.push(toY(bb.min.x, bb.min.y, bb.min.z), toY(bb.max.x, bb.max.y, bb.max.z));
}
scene.add(equipGroup);

// ── 기둥 ──
const columnGroup = new THREE.Group();
for (const obs of (designData.Obstacles || [])) {
  if (obs.ddworksType !== 'COLUMN_STRUCTURE') continue;
  const b = obs.boundary;
  if (!b?.min || !b?.max) continue;
  const sx = b.max.x - b.min.x, sy = b.max.y - b.min.y, sz = b.max.z - b.min.z;
  if (sx < 1 || sy < 1 || sz < 1) continue;
  const cx = (b.min.x + b.max.x)/2, cy = (b.min.y + b.max.y)/2, cz = (b.min.z + b.max.z)/2;
  const g = new THREE.BoxGeometry(sx, sz, sy);
  const m = new THREE.MeshPhongMaterial({ color: 0xff3c3c, transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.copy(toY(cx, cy, cz));
  columnGroup.add(mesh);
}
scene.add(columnGroup);

// ── 기존 그룹 경로 (kscta01만, 반투명) ──
const groupPathsGroup = new THREE.Group();
groupPathsGroup.visible = false;
for (const g of groupData) {
  if (g.equipment_name !== 'kscta01') continue;
  for (const path of g.paths) {
    const pts = reconstructPath(path);
    if (pts.length < 2) continue;
    const geom = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({ color: 0xb4b4ff, transparent: true, opacity: 0.2 });
    groupPathsGroup.add(new THREE.Line(geom, mat));
    for (const p of pts) allPts.push(p);
  }
}
scene.add(groupPathsGroup);

// ── 자동 생성 경로 ──
const autoPathsGroup = new THREE.Group();
const routeObjects = [];

for (const r of autoData) {
  const rGroup = new THREE.Group();
  rGroup.userData = r;

  for (const path of r.paths) {
    const pts = reconstructPath(path);
    if (pts.length < 2) continue;

    // 점선 경로
    const geom = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineDashedMaterial({ color: 0x00ffc8, linewidth: 2, transparent: true, opacity: 0.95, dashSize: 60, gapSize: 25 });
    const line = new THREE.Line(geom, mat);
    line.computeLineDistances();
    rGroup.add(line);

    // 시작점
    const sSphere = new THREE.Mesh(new THREE.SphereGeometry(50, 10, 8), new THREE.MeshPhongMaterial({ color: 0xffff00, transparent: true, opacity: 0.85 }));
    sSphere.position.copy(pts[0]);
    rGroup.add(sSphere);

    // 끝점
    const eSphere = new THREE.Mesh(new THREE.SphereGeometry(40, 10, 8), new THREE.MeshPhongMaterial({ color: 0xff5066, transparent: true, opacity: 0.75 }));
    eSphere.position.copy(pts[pts.length - 1]);
    rGroup.add(eSphere);

    for (const p of pts) allPts.push(p);
  }

  autoPathsGroup.add(rGroup);
  routeObjects.push(rGroup);
}
scene.add(autoPathsGroup);

// ── 카메라 Fit ──
function fitCamera() {
  if (!allPts.length) return;
  const box = new THREE.Box3();
  for (const p of allPts) box.expandByPoint(p);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  controls.target.copy(center);
  camera.position.set(center.x + maxDim * 0.6, center.y + maxDim * 0.5, center.z + maxDim * 0.8);
}
fitCamera();

// ── 패널 ──
const listEl = document.getElementById('route-list');
const detailEl = document.getElementById('detail');
const detailTitle = document.getElementById('detail-title');
const detailGrid = document.getElementById('detail-grid');
let selectedIdx = -1;

function buildList() {
  listEl.innerHTML = '';
  autoData.forEach((r, idx) => {
    const v = r.validation;
    const sc = r.spatial_context || {};
    const p = r.paths[0];
    const el = document.createElement('div');
    el.className = 'route-item' + (idx === selectedIdx ? ' active' : '');
    const badge = v.is_valid ? '<span class="badge badge-pass">PASS</span>' : '<span class="badge badge-warn">WARN</span>';
    el.innerHTML = `
      <div class="title">${badge} ${r.equipment_name}/${r.utility}/${r.size}</div>
      <div class="meta">
        품질: ${v.quality_score.toFixed(3)} | 매칭: ${(r.match_score||0).toFixed(3)} | 길이: ${p.path_total_length.toFixed(0)}mm<br>
        기둥충돌: ${v.collision_count||0} | 장애물: ${sc.obstacles_nearby||0} | 레벨: ${(sc.levels_traversed||[]).join('→')}<br>
        면: ${sc.start_face||'-'} | 종단: ${sc.terminal_type||'-'}
      </div>`;
    el.addEventListener('click', () => selectRoute(idx));
    listEl.appendChild(el);
  });
}

function selectRoute(idx) {
  selectedIdx = (selectedIdx === idx) ? -1 : idx;
  routeObjects.forEach((rg, i) => {
    rg.traverse(c => { if (c.material) c.material.opacity = (selectedIdx === -1 || i === selectedIdx) ? 0.95 : 0.1; });
  });

  if (selectedIdx >= 0) {
    const r = autoData[selectedIdx];
    const v = r.validation;
    const sc = r.spatial_context || {};
    const sd = r.similarity_detail || {};
    detailTitle.textContent = `#${r.group_id} ${r.equipment_name}/${r.utility}/${r.size}`;

    const barW = (val) => `<span class="sim-bar" style="width:${Math.round(val*80)}px"></span>`;
    detailGrid.innerHTML = `
      <div class="field">품질: <span>${v.quality_score.toFixed(4)}</span></div>
      <div class="field">매칭: <span>${(r.match_score||0).toFixed(4)}</span></div>
      <div class="field">원본 그룹: <span>#${r.source_group_id}</span></div>
      <div class="field">기둥 충돌: <span>${v.collision_count||0}</span></div>
      <div class="field">주변 장애물: <span>${sc.obstacles_nearby||0}</span></div>
      <div class="field">밀도: <span>${(sc.obstacle_density||0).toFixed(3)}</span></div>
      <div class="field">시작 면: <span>${sc.start_face||'-'}</span></div>
      <div class="field">종단 타입: <span>${sc.terminal_type||'-'}</span></div>
      <div class="field">레벨 경유: <span>${(sc.levels_traversed||[]).join(' → ')}</span></div>
      <div class="field">Arrow 유사도: <span>${(sd.arrow||0).toFixed(3)}</span> ${barW(sd.arrow||0)}</div>
      <div class="field">벡터 유사도: <span>${(sd.vector||0).toFixed(3)}</span> ${barW(sd.vector||0)}</div>
      <div class="field">장비상대 유사도: <span>${(sd.equip_relative||0).toFixed(3)}</span> ${barW(sd.equip_relative||0)}</div>
      <div class="field">종단점 유사도: <span>${(sd.terminal||0).toFixed(3)}</span> ${barW(sd.terminal||0)}</div>
      <div class="field">장애물 유사도: <span>${(sd.obstacle||0).toFixed(3)}</span> ${barW(sd.obstacle||0)}</div>
      <div class="field">레벨 유사도: <span>${(sd.level||0).toFixed(3)}</span> ${barW(sd.level||0)}</div>
    `;
    detailEl.style.display = 'block';

    // 카메라 이동
    const rg = routeObjects[selectedIdx];
    const box = new THREE.Box3().setFromObject(rg);
    if (!box.isEmpty()) {
      const c = box.getCenter(new THREE.Vector3());
      const s = box.getSize(new THREE.Vector3());
      controls.target.copy(c);
      camera.position.set(c.x + Math.max(s.x,s.y,s.z)*1.2, c.y + 3000, c.z + 3000);
    }
  } else {
    detailEl.style.display = 'none';
  }
  buildList();
}

buildList();

// ── 툴바 ──
const toggleBtn = (id, group) => {
  document.getElementById(id).addEventListener('click', e => {
    group.visible = !group.visible;
    e.target.classList.toggle('active', group.visible);
  });
};
toggleBtn('btn-equip', equipGroup);
toggleBtn('btn-columns', columnGroup);
toggleBtn('btn-groups', groupPathsGroup);
toggleBtn('btn-auto', autoPathsGroup);
document.getElementById('btn-fit').addEventListener('click', fitCamera);

// ── 렌더 루프 ──
const statsEl = document.getElementById('stats');
let fc = 0, lt = performance.now();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  fc++;
  const now = performance.now();
  if (now - lt >= 1000) { statsEl.textContent = `${fc} FPS | ${autoData.length} auto routes | ${columnGroup.children.length} columns`; fc = 0; lt = now; }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
